spring:
  application:
    name: vella-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vellatech_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080

app:
  jwt:
    secret: vellatech-secret-key-2024-super-segura-cambiar-en-produccion
    expiration: 86400000  # 24 horas en ms
